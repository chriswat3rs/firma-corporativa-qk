<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generador de la firma de correo institucional de Quality &amp; Knowledge para Outlook, Gmail y Apple Mail.">
  <title>Firma Corporativa Oficial · Quality &amp; Knowledge</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/signature.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <header class="page-header">
      <h1>Firma Corporativa Oficial</h1>
      <p>Genera tu firma de correo institucional con tus datos. Lista para usarse en Outlook, Gmail y Apple Mail.</p>
    </header>

    <div class="grid">
      <!-- Formulario -->
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Datos del colaborador</h2>

        <div class="field">
          <input id="nombre" type="text" placeholder=" " autocomplete="name">
          <label for="nombre">Nombre y Apellido</label>
        </div>
        <div class="field">
          <input id="puesto" type="text" placeholder=" " autocomplete="organization-title">
          <label for="puesto">Puesto</label>
        </div>
        <div class="field">
          <input id="area" type="text" placeholder=" ">
          <label for="area">Área</label>
        </div>
        <div class="field">
          <input id="correo" type="text" placeholder=" " autocomplete="email">
          <label for="correo">Correo</label>
        </div>
        <div class="field">
          <input id="telPersonal" type="text" placeholder=" " autocomplete="tel">
          <label for="telPersonal">Teléfono personal (opcional)</label>
        </div>

        <div class="checkfield">
          <input id="waEnable" type="checkbox" aria-controls="waField">
          <label for="waEnable">Agregar WhatsApp a la firma</label>
        </div>
        <div class="field" id="waField" hidden>
          <input id="waNumero" type="text" placeholder=" ">
          <label for="waNumero">Enlace de WhatsApp</label>
        </div>

        <p class="sublabel">Firma HTML · texto y enlaces clickeables</p>
        <button class="btn" id="copyRich" type="button">Copiar firma (HTML)</button>
      </section>

      <!-- Vista previa -->
      <section class="card" aria-labelledby="preview-title">
        <div class="preview-head">
          <h2 id="preview-title">Vista previa</h2>
        </div>
        <div class="stage" id="stage"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Copiado</div>
</body>
</html>
